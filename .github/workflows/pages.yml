name: Verify release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ransomware-zero-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test engine.test.mjs && node --check app.mjs
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Browser regression suite
        env:
          RZ_BROWSER: ${{ matrix.browser }}
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/rz-server.log 2>&1 &
          python browser_test.py
